data:
  tokenizer: null
  use_shm: false
  train_files: ${oc.env:RL_TRAIN_DATA}
  val_files: ${oc.env:RL_VAL_DATA}
  prompt_key: prompt
  reward_fn_key: data_source
  max_prompt_length: 2048
  max_response_length: 512
  train_batch_size: 16
  val_batch_size: 128
  return_raw_input_ids: false
  return_raw_chat: true
  return_full_prompt: false
  shuffle: true
  filter_overlong_prompts: true
  filter_overlong_prompts_workers: 1
  truncation: left
  image_key: images
  video_key: videos
  trust_remote_code: false
  apply_chat_template_kwargs:
    enable_thinking: false
  custom_cls:
    path: null
    name: null
actor_rollout_ref:
  hybrid_engine: true
  model:
    path: ${oc.env:SFT_MODEL}
    use_shm: false
    external_lib: null
    override_config: {}
    enable_gradient_checkpointing: true
    enable_activation_offload: false
    use_remove_padding: true
    lora_rank: 0
    reflect_lora:
      enabled: false
    use_liger: false
    use_fused_kernels: false
    trust_remote_code: false
  actor:
    strategy: fsdp
    response_only_logits: true
    ppo_mini_batch_size: 256
    ppo_micro_batch_size: null
    ppo_micro_batch_size_per_gpu: 32
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 8608
    grad_clip: 1.0
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    clip_ratio_c: 3.0
    loss_agg_mode: token-mean
    entropy_coeff: 0.001
    use_invalid_action_penalty: true
    invalid_action_penalty_coef: 0.1
    use_kl_loss: true
    use_torch_compile: true
    kl_loss_coef: 0.01
    kl_loss_type: low_var_kl
    ppo_epochs: 1
    shuffle: false
    ulysses_sequence_parallel_size: 1
    policy_loss:
      loss_mode: vanilla
    checkpoint:
      contents:
      - model
      - optimizer
      - extra
      - elastic
    optim:
      lr: 1.0e-06
      lr_warmup_steps: 0
      lr_warmup_steps_ratio: 0.0
      min_lr_ratio: 0.0
      num_cycles: 0.5
      warmup_style: constant
      total_training_steps: -1
      weight_decay: 0.01
    fsdp_config:
      wrap_policy:
        min_num_params: 0
      param_offload: true
      optimizer_offload: true
      offload_policy: false
      reshard_after_forward: true
      fsdp_size: -1
      model_dtype: fp32
    elastic_logical_world_size: 8
    rs_joint_update: true
    rs_joint_diagnostics: true
    rs_joint_diagnostics_first_last: true
    rs_joint_progress: true
    defer_gradient_sync: false
    stream_optimizer_states: true
  ref:
    strategy: fsdp
    response_only_logits: true
    fsdp_config:
      param_offload: true
      reshard_after_forward: true
      wrap_policy:
        min_num_params: 0
      keep_reference_on_gpu: true
    use_torch_compile: ${actor_rollout_ref.actor.use_torch_compile}
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 32
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    ulysses_sequence_parallel_size: ${actor_rollout_ref.actor.ulysses_sequence_parallel_size}
    observation_micro_batch_size: 4
  rollout:
    name: vllm
    reuse_unchanged_weights: true
    mode: sync
    chat_scheduler: null
    temperature: 1.0
    top_k: -1
    top_p: 1
    use_fire_sampling: false
    prompt_length: ${data.max_prompt_length}
    response_length: ${data.max_response_length}
    dtype: bfloat16
    gpu_memory_utilization: 0.24
    ignore_eos: false
    enforce_eager: false
    free_cache_engine: false
    load_format: dummy_dtensor
    layered_summon: false
    tensor_model_parallel_size: 1
    max_num_batched_tokens: 32768
    max_model_len: 32768
    max_num_seqs: 1024
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 32
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    disable_log_stats: true
    enable_chunked_prefill: false
    do_sample: true
    n: 1
    engine_kwargs:
      vllm:
        swap_space: null
    val_kwargs:
      top_k: -1
      top_p: 1.0
      temperature: 0.4
      n: 1
      do_sample: true
    multi_turn:
      enable: false
      max_turns: null
      tool_config_path: null
      format: chatml
reward_model:
  enable: false
  reward_manager: episode
  launch_reward_fn_async: false
custom_reward_function:
  path: null
  name: compute_score
algorithm:
  gamma: 0.95
  lam: 1.0
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  kl_penalty: kl
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
    horizon: 10000
    target_kl: 0.1
  use_pf_ppo: false
  pf_ppo:
    reweight_method: pow
    weight_pow: 2.0
  filter_groups:
    enable: false
    max_num_gen_batches: 10
  route:
    mode: selective_gigpo
    lambda_route: 0.02
    rms_normalize: false
  selective_gigpo:
    advantage_estimator: bepo_unified_obs_action20
    actor_signal_scope: action_command
    modulation_mode: symmetric_alignment
    modulation_max_factor: 16.0
    graph_scale_floor: 0.1
    gamma: 0.95
    invalid_penalty: 0.1
    modulation_lambda: 1.0
    modulation_tau: 0.5
    rs_reward_clip: 3.0
    skip_teacher_on_all_success: true
  grsd:
    enabled: true
    reflect_max_prompt_length: 32256
    teacher_max_prompt_length: 4096
    reflect_loss_coef: 0.1
    reflect_do_sample: true
    reflect_max_turns: 50
    reflect_max_chars_per_obs: 400
    reflect_sample_freq: 1
    reflect_sample_dir: ${trainer.default_local_dir}/reflect_samples
    judge_enabled: false
trainer:
  balance_batch: true
  total_epochs: 150
  total_training_steps: 150
  project_name: response_rs
  experiment_name: ${oc.env:EXPERIMENT_NAME,response_rs}
  logger:
  - console
  log_val_generations: 0
  rollout_data_dir: ${trainer.default_local_dir}/rollouts
  validation_data_dir: ${trainer.default_local_dir}/validation
  nnodes: 1
  n_gpus_per_node: 8
  save_freq: 1
  resume_mode: disable
  resume_from_path: null
  val_before_train: false
  val_only: false
  test_freq: 5
  critic_warmup: 0
  default_hdfs_dir: null
  del_local_ckpt_after_load: false
  default_local_dir: ${oc.env:RL_OUTPUT,runs/rl}
  max_actor_ckpt_to_keep: null
  max_critic_ckpt_to_keep: null
  ray_wait_register_center_timeout: 600
  device: cuda
  gpus_per_node:
  - 8
  checkpoint_keep_latest_and_tens: true
  checkpoint_milestone_interval: 20
  analysis_sample_steps:
  - 1
  - 2
  - 17
  - 34
  - 51
  - 67
  - 84
  - 100
  - 117
  - 133
  - 150
  controller_ip: null
ray_init:
  num_cpus: null
  runtime_env:
    env_vars: {}
env:
  env_name: alfworld/AlfredTWEnv
  seed: 0
  max_steps: 30
  history_length: 5
  resources_per_worker:
    num_cpus: 0.1
    num_gpus: 0
  rollout:
    n: 8
  alfworld:
    eval_dataset: eval_in_distribution
    train_start_offset: 0
  webshop:
    use_small: true
    human_goals: false
    catalog_seed: 2026
    worker_node_ip: null
